name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Normalize Osservatorio headings
        shell: bash
        run: |
          set -euo pipefail

          find dist/osservatorio -type f -name 'index.html' -print0 \
            | xargs -0 sed -i 's/>Descrizione</>Approfondimento</g'

          if grep -RIl '>Descrizione<' dist/osservatorio --include='*.html' | grep -q .; then
            echo "Sono ancora presenti intestazioni Descrizione nell'HTML generato."
            grep -RIl '>Descrizione<' dist/osservatorio --include='*.html'
            exit 1
          fi

          target='dist/osservatorio/purgatorio-rita-maffei-2021/index.html'
          if ! grep -q '>Approfondimento<' "$target"; then
            echo "Verifica fallita: Approfondimento non compare in $target"
            exit 1
          fi

      - name: Process HTML links
        uses: shravanngoswamii/html-link-action@v1
        with:
          site-dir: dist
          nofollow: true
          noopener: true
          noreferrer: true
          external-target-blank: true
          strip-tracking-params: true
          check-links: true

      - name: Verify heading after HTML processing
        shell: bash
        run: |
          set -euo pipefail
          target='dist/osservatorio/purgatorio-rita-maffei-2021/index.html'
          grep -q '>Approfondimento<' "$target"
          ! grep -q '>Descrizione<' "$target"

      - name: Add .nojekyll file
        run: touch ./dist/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./dist
          branch: gh-pages
